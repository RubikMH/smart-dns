# DNS Routing Configuration
# Smart routing rules based on various criteria

# Define variables for routing decisions
map $remote_addr $client_type {
    default standard;
    ~^192\.168\. internal;
    ~^10\. internal; 
    ~^172\.1[6-9]\. internal;
    ~^172\.2[0-9]\. internal;
    ~^172\.3[0-1]\. internal;
}

# Route based on time (example: family filtering during day hours)
map $time_iso8601 $time_based_upstream {
    default dns_backends;
    ~T0[6-9]: family_dns_backends;    # 6-9 AM
    ~T1[0-7]: family_dns_backends;    # 10 AM - 5 PM  
    ~T(18|19|20): family_dns_backends; # 6-8 PM
}

# Map specific query types to upstreams
map $server_port $dns_upstream {
    53 dns_backends;
    853 secure_dns_backends;
    default dns_backends;
}

# Geographic routing (requires GeoIP)
map $geoip_country_code $geo_upstream {
    default dns_backends;
    US geo_dns_backends;
    GB geo_dns_backends;  
    CA geo_dns_backends;
    AU geo_dns_backends;
}

# Client-specific routing based on source IP ranges
map $remote_addr $client_upstream {
    default dns_backends;
    
    # Kids devices - use family-safe DNS
    ~^192\.168\.1\.50$ family_dns_backends;
    ~^192\.168\.1\.51$ family_dns_backends;
    ~^192\.168\.1\.52$ family_dns_backends;
    
    # Work devices - use secure DNS
    ~^192\.168\.1\.100$ secure_dns_backends;
    ~^192\.168\.1\.101$ secure_dns_backends;
    
    # Gaming devices - use fast DNS
    ~^192\.168\.1\.200$ dns_backends;
    ~^192\.168\.1\.201$ dns_backends;
    
    # Streaming devices - use geo-unblocking DNS
    ~^192\.168\.1\.150$ geo_dns_backends;
    ~^192\.168\.1\.151$ geo_dns_backends;
}