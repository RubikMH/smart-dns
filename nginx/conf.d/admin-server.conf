# Admin/Management Server Configuration
# Provides web interface for monitoring and configuration

server {
    listen 8090;
    listen [::]:8090;
    server_name admin.smart-dns.local localhost;
    
    # Security - access control
    # NOTE: Disabled because Docker/host networking can make nginx see a non-local
    # client IP (causing 403 on localhost). If you need protection, enable
    # auth_basic below or re-enable allow/deny with your real client subnet.
    #
    # allow 127.0.0.1;
    # allow ::1;
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # deny all;
    
    # Basic auth protection (optional)
    # auth_basic "Smart DNS Admin";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    
    access_log /var/log/nginx/admin_access.log smart_dns;
    error_log /var/log/nginx/admin_error.log;
    
    # Static admin interface files
    location / {
        root /var/www/smart-dns-admin;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Prevent caching of admin interface
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # API endpoints for configuration management
    location /api/ {
        # Rate limiting for API access
        limit_req zone=api burst=10 nodelay;
        
        # Proxy to admin backend service
        proxy_pass http://127.0.0.1:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type application/json;
        
        # CORS headers for API access
        add_header Access-Control-Allow-Origin "http://localhost:8090" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Real-time statistics endpoint
    location /stats {
        stub_status on;
        access_log off;
    }
    
    # DNS query statistics (if available)
    location /dns-stats {
        proxy_pass http://127.0.0.1:9091/stats;
        proxy_set_header Host $host;
    }
    
    # Log file viewing (tail logs)
    location /logs/ {
        # Serve log files (read-only)
        root /var/log/nginx;
        autoindex on;
        autoindex_format json;
        
        # Only allow access to specific log files
        location ~* \.(log)$ {
            add_header Content-Type text/plain;
        }
        
        # Deny access to sensitive files
        location ~* \.(conf|key|crt)$ {
            deny all;
        }
    }
    
    # Configuration management endpoint
    location /config/ {
        # Allow config file management via API
        proxy_pass http://127.0.0.1:9092/config/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Only allow specific methods
        limit_except GET POST PUT {
            deny all;
        }
    }
    
    # Health check for admin services
    location /health {
        access_log off;
        return 200 "Admin Interface OK\n";
        add_header Content-Type text/plain;
    }
    
    # WebSocket endpoint for real-time monitoring
    location /ws {
        proxy_pass http://127.0.0.1:9093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }
    
    # Nginx configuration test and reload (Lua module required - DISABLED)
    # Uncomment when using OpenResty or nginx with lua module
    # location /admin/reload {
    #     content_by_lua_block {
    #         local handle = io.popen("nginx -t && systemctl reload nginx 2>&1")
    #         local result = handle:read("*a")
    #         handle:close()
    #         ngx.header.content_type = "text/plain"
    #         ngx.say(result)
    #     }
    # }
    
    # SSL certificate status
    location /ssl-status {
        proxy_pass http://127.0.0.1:9094/ssl-status;
        proxy_set_header Host $host;
    }
}