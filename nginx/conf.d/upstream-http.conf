# HTTP/HTTPS Upstream configurations
# For web traffic routing and geo-unblocking

# Streaming services routing
upstream netflix_upstream {
    server 23.246.0.0:443 weight=5 max_fails=2 fail_timeout=30s;
    server 185.2.220.0:443 weight=3 max_fails=2 fail_timeout=30s;
    keepalive 32;
}

upstream hulu_upstream {
    server 23.32.0.0:443 weight=5 max_fails=2 fail_timeout=30s;
    server 199.232.0.0:443 weight=3 max_fails=2 fail_timeout=30s;
    keepalive 32;
}

upstream disney_upstream {
    server 199.232.28.0:443 weight=5 max_fails=2 fail_timeout=30s;
    server 23.59.158.0:443 weight=3 max_fails=2 fail_timeout=30s;
    keepalive 32;
}

upstream bbc_upstream {
    server 212.58.244.0:443 weight=5 max_fails=2 fail_timeout=30s;
    server 151.101.0.0:443 weight=3 max_fails=2 fail_timeout=30s;
    keepalive 32;
}

# Generic geo-unblocking upstreams by region
upstream us_region_upstream {
    # US-based servers for geo-restricted content
    server 8.8.8.8:443 weight=5;
    server 1.1.1.1:443 weight=4;
    server 208.67.222.222:443 weight=3;
    keepalive 64;
}

upstream uk_region_upstream {
    # UK-based servers
    server 1.1.1.1:443 weight=5;
    server 8.8.8.8:443 weight=4;
    keepalive 64;
}

upstream eu_region_upstream {
    # EU-based servers
    server 94.140.14.14:443 weight=5;
    server 1.1.1.1:443 weight=4;
    server 8.8.8.8:443 weight=3;
    keepalive 64;
}

# Default fallback upstream
upstream default_upstream {
    server 1.1.1.1:443 weight=5 max_fails=3 fail_timeout=10s;
    server 8.8.8.8:443 weight=4 max_fails=3 fail_timeout=10s;
    server 9.9.9.9:443 weight=3 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Health check upstream (for monitoring)
upstream health_upstream {
    server 1.1.1.1:443;
    server 8.8.8.8:443 backup;
}