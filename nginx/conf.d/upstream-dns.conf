# Upstream DNS server configurations
# Different upstream groups for various purposes

# Primary DNS backends - Fast and reliable
upstream dns_backends {
    # Cloudflare DNS (Primary)
    server 1.1.1.1:53 weight=5 max_fails=2 fail_timeout=10s;
    server 1.0.0.1:53 weight=5 max_fails=2 fail_timeout=10s;
    
    # Google DNS (Secondary)  
    server 8.8.8.8:53 weight=3 max_fails=2 fail_timeout=10s;
    server 8.8.4.4:53 weight=3 max_fails=2 fail_timeout=10s;
    
    # Quad9 DNS (Tertiary)
    server 9.9.9.9:53 weight=2 max_fails=2 fail_timeout=10s;
    server 149.112.112.112:53 weight=2 max_fails=2 fail_timeout=10s;
}

# Secure DNS backends - Privacy focused
upstream secure_dns_backends {
    # Cloudflare DNS over TLS
    server 1.1.1.1:853 weight=5 max_fails=2 fail_timeout=10s;
    server 1.0.0.1:853 weight=5 max_fails=2 fail_timeout=10s;
    
    # Quad9 Secure DNS
    server 9.9.9.9:853 weight=4 max_fails=2 fail_timeout=10s;
    server 149.112.112.112:853 weight=4 max_fails=2 fail_timeout=10s;
    
    # AdGuard DNS (Ad blocking)
    server 94.140.14.14:853 weight=3 max_fails=2 fail_timeout=10s;
    server 94.140.15.15:853 weight=3 max_fails=2 fail_timeout=10s;
}

# Geo-unblocking DNS - For streaming and geo-restricted content
upstream geo_dns_backends {
    # Smart DNS providers for geo-unblocking
    server 8.8.8.8:53 weight=5 max_fails=2 fail_timeout=10s;
    server 8.8.4.4:53 weight=5 max_fails=2 fail_timeout=10s;
    server 1.1.1.1:53 weight=4 max_fails=2 fail_timeout=10s;
    server 1.0.0.1:53 weight=4 max_fails=2 fail_timeout=10s;
}

# Ad-blocking DNS - Blocks ads and malware
upstream adblock_dns_backends {
    # AdGuard DNS (Ads & tracking blocking)
    server 94.140.14.14:53 weight=5 max_fails=2 fail_timeout=10s;
    server 94.140.15.15:53 weight=5 max_fails=2 fail_timeout=10s;
    
    # OpenDNS with malware protection
    server 208.67.222.222:53 weight=4 max_fails=2 fail_timeout=10s;
    server 208.67.220.220:53 weight=4 max_fails=2 fail_timeout=10s;
    
    # Quad9 with malware blocking
    server 9.9.9.9:53 weight=4 max_fails=2 fail_timeout=10s;
    server 149.112.112.112:53 weight=4 max_fails=2 fail_timeout=10s;
}

# Family-safe DNS - Content filtering
upstream family_dns_backends {
    # OpenDNS Family Shield
    server 208.67.222.123:53 weight=5 max_fails=2 fail_timeout=10s;
    server 208.67.220.123:53 weight=5 max_fails=2 fail_timeout=10s;
    
    # AdGuard Family Protection
    server 94.140.14.15:53 weight=4 max_fails=2 fail_timeout=10s;
    server 94.140.15.16:53 weight=4 max_fails=2 fail_timeout=10s;
    
    # CleanBrowsing Family
    server 185.228.168.168:53 weight=3 max_fails=2 fail_timeout=10s;
    server 185.228.169.168:53 weight=3 max_fails=2 fail_timeout=10s;
}