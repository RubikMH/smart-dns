# HTTP/HTTPS Proxy Server Configuration
# Smart domain-based routing for geo-unblocking and content access

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    
    # Logging
    access_log /var/log/nginx/proxy_access.log smart_dns;
    error_log /var/log/nginx/proxy_error.log;
    
    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    
    # Security headers
    add_header X-Proxy-By "Smart-DNS-Proxy" always;
    
    # Netflix routing
    location ~* ^https?://.*\.netflix\.com {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://netflix_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        
        # Handle streaming optimizations
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Hulu routing
    location ~* ^https?://.*\.hulu\.com {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://hulu_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Disney+ routing  
    location ~* ^https?://.*\.disney(plus)?\.com {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://disney_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # BBC iPlayer routing
    location ~* ^https?://.*\.bbc\.co\.uk {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://bbc_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        
        # Add UK IP spoofing headers if needed
        proxy_set_header CF-IPCountry "GB";
        proxy_set_header X-Forwarded-Country "GB";
        
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Generic US content routing
    location ~* \.(com|us)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://us_region_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Generic UK content routing
    location ~* \.(co\.uk|uk)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://uk_region_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        
        proxy_set_header CF-IPCountry "GB";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Default proxy for all other traffic
    location / {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://default_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Basic caching for static content
        proxy_cache proxy_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
    }
}

# HTTPS Proxy Server (handles CONNECT method for HTTPS traffic)
server {
    listen 8443;
    listen [::]:8443;
    server_name _;
    
    access_log /var/log/nginx/https_proxy_access.log smart_dns;
    error_log /var/log/nginx/https_proxy_error.log;
    
    # Handle CONNECT method for HTTPS proxying
    location / {
        proxy_connect;
        proxy_connect_allow 443 563;
        proxy_connect_connect_timeout 10s;
        proxy_connect_data_timeout 10s;
        
        # Access control
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }
}

# Proxy Cache Zone
proxy_cache_path /tmp/proxy_cache levels=1:2 keys_zone=proxy_cache:10m max_size=500m inactive=60m use_temp_path=off;