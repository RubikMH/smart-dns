# DNS over HTTPS (DoH) Server Configuration
# Provides secure DNS queries over HTTPS (RFC 8484)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dns.example.com localhost;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none';" always;
    
    # Rate limiting for DoH queries
    limit_req zone=dns burst=50 nodelay;
    
    # DoH endpoint - RFC 8484 compliant
    location /dns-query {
        # Allow GET and POST methods for DoH
        limit_except GET POST {
            deny all;
        }
        
        # Proxy to upstream DoH servers
        proxy_pass https://cloudflare-dns.com/dns-query;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        
        # Set required headers
        proxy_set_header Host cloudflare-dns.com;
        proxy_set_header Accept application/dns-message;
        proxy_set_header Content-Type application/dns-message;
        proxy_set_header User-Agent "Smart-DNS-Proxy/1.0";
        
        # Handle DoH specific headers
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        
        # Cache DNS responses briefly
        proxy_cache dns_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        
        # Logging
        access_log /var/log/nginx/doh_access.log smart_dns;
        error_log /var/log/nginx/doh_error.log;
    }
    
    # Alternative DoH endpoint (JSON API style)
    location /resolve {
        limit_except GET {
            deny all;
        }
        
        # Proxy to Google DNS JSON API
        proxy_pass https://dns.google/resolve;
        proxy_pass_request_headers on;
        
        proxy_set_header Host dns.google;
        proxy_set_header Accept application/json;
        
        # Cache JSON responses
        proxy_cache dns_cache;
        proxy_cache_valid 200 300s;
        proxy_cache_valid 404 60s;
        
        # Add CORS headers for web clients
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
        
        access_log /var/log/nginx/doh_json_access.log smart_dns;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Block all other requests
    location / {
        return 404;
    }
}

# DNS Cache Zone
proxy_cache_path /tmp/dns_cache levels=1:2 keys_zone=dns_cache:10m max_size=100m inactive=60m use_temp_path=off;