# Main nginx configuration for Smart DNS
# Enables all required modules and includes sub-configurations

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules
load_module modules/ngx_stream_module.so;
load_module modules/ngx_http_geoip_module.so;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# DNS Stream Proxy Configuration
stream {
    # Logging configuration
    log_format dns_log '$remote_addr - [$time_local] $protocol $bytes_sent $bytes_received $session_time upstream: $upstream_addr';
    access_log /var/log/nginx/dns_access.log dns_log;

    # Include upstream DNS servers
    include /etc/nginx/conf.d/upstream-dns.conf;
    
    # Include DNS routing rules
    include /etc/nginx/conf.d/dns-routing.conf;

    # DNS Server (UDP and TCP)
    server {
        listen 53 udp;
        listen 53;
        proxy_pass dns_backends;
        proxy_timeout 1s;
        proxy_responses 1;
        error_log /var/log/nginx/dns_error.log;
    }

    # DNS over TLS (DoT) - Port 853  
    server {
        listen 853 ssl;
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass secure_dns_backends;
        proxy_timeout 5s;
    }
}

# HTTP/HTTPS Configuration  
http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut="$upstream_response_time"';
    
    log_format smart_dns '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" upstream: $upstream_addr '
                         'country: $geoip_country_code region: $geoip_region';

    access_log /var/log/nginx/access.log smart_dns;
    error_log /var/log/nginx/error.log;

    # GeoIP configuration
    geoip_country /usr/share/GeoIP/GeoIP.dat;
    geoip_city /usr/share/GeoIP/GeoLiteCity.dat;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dns:10m rate=100r/s;

    # Include upstream servers for HTTP/HTTPS
    include /etc/nginx/conf.d/upstream-http.conf;

    # Include server configurations
    include /etc/nginx/conf.d/doh-server.conf;
    include /etc/nginx/conf.d/proxy-server.conf;
    include /etc/nginx/conf.d/admin-server.conf;

    # Default server block
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }
}